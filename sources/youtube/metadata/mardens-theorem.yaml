description: "Take any cubic polynomial p(z) with three complex roots a, b, c. Plot the triangle. Take the derivative — you get a quadratic, with two roots. Now construct the Steiner inellipse of the triangle: the unique inscribed ellipse tangent to each side at its midpoint. Mark its two foci. Those two foci are exactly the two roots of p′. Always.\n\nThe two definitions could not be more different in flavor. One comes from calculus (slope-of-tangent). The other comes from synthetic geometry (tangency at midpoints). They produce the same two points. For every cubic.\n\nThis is Marden's theorem — actually due to Jörg Siebeck (1864), popularized by Morris Marden (1949), and brought to elementary attention by Dan Kalman in his American Mathematical Monthly paper \"An Elementary Proof of Marden's Theorem\" (2008). Kalman called it \"the most marvelous theorem in mathematics.\"\n\nThe proof is three steps: (1) the equilateral case is trivial, since both pairs collapse to the centroid; (2) both sides of the theorem are preserved under affine transformations; (3) every triangle is the affine image of an equilateral. Done.\n\nBôcher (1892) gave a beautiful electrostatic interpretation: place three equal positive charges at a, b, c. The two points where the field cancels are the roots of p′. They are also the foci of the Steiner inellipse. Physics, calculus, and geometry all describing the same two points.\n\nChapters:\n0:00 The question\n0:32 The starting point (Gauss–Lucas)\n1:03 A first guess (and why none of the obvious centers work)\n1:42 The Steiner inellipse\n2:17 Marden's theorem stated\n2:58 Demonstration (p(z) = (z−1)(z−i)(z−2))\n3:54 Why this is wild\n4:28 Who proved it (Siebeck 1864, Marden 1949, Kalman 2008)\n5:13 The first clue: Vieta + centroid\n6:01 Foci midpoint = ellipse center = centroid\n6:43 Affine equivariance\n7:31 Reducing to the equilateral\n8:19 The full proof\n9:03 Bôcher's electrostatic interpretation\n9:56 Final thought"
